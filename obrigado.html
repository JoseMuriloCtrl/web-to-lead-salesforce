<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f4f6f9;
            color: #16325c;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            margin: 0 auto;
        }
        h1 {
            color: #04844b;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #54698d;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .michael-img {
            width: 100%;
            max-width: 380px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Formulário Enviado!</h1>
        <p>Obrigado pelo contato! Recebemos suas informações com sucesso e em breve retornaremos.</p>
        
        <!-- Imagem/GIF do Michael Scott comemorando -->
        <img src="https://media.giphy.com/media/n4oKYFlAcvCAE/giphy.gif" alt="Michael Scott Comemorando" class="michael-img">
    </div>
</body>
</html>
